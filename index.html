<!DOCTYPE html>
<html lang="es">
<head>
    <title>Te amo Fran</title>
    <meta charset="UTF-8">
    <meta name="description" content="Festejar el inicio de la primavera en el hemisferio sur">
    <meta name="autor" content="Steve Brayton Góngora Luévano">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* Fondo oscuro para resaltar el contenido */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #FFF; /* Color de texto blanco */
        }

        .glow-text {
            font-size: 3rem;
            color: #FFD700; /* Color dorado para el texto */
            text-shadow: 
                0 0 5px rgba(255, 215, 0, 0.5),
                0 0 10px rgba(255, 215, 0, 0.5),
                0 0 15px rgba(255, 215, 0, 0.7),
                0 0 20px rgba(255, 215, 0, 1);
            animation: glow-animation 1.5s ease-in-out infinite;
            margin-top: 20px; /* Espaciado superior */
        }

        @keyframes glow-animation {
            0%, 100% {
                text-shadow: 
                    0 0 5px rgba(255, 215, 0, 0.5),
                    0 0 10px rgba(255, 215, 0, 0.5),
                    0 0 15px rgba(255, 215, 0, 0.7),
                    0 0 20px rgba(255, 215, 0, 1);
            }
            50% {
                text-shadow: 
                    0 0 10px rgba(255, 215, 0, 0.7),
                    0 0 20px rgba(255, 215, 0, 0.7),
                    0 0 30px rgba(255, 215, 0, 1),
                    0 0 40px rgba(255, 215, 0, 1);
            }
        }

        .sunflower {
            position: relative;
            width: 200px;
            height: 300px;
            margin-bottom: 20px; /* Espaciado inferior */
        }

        .flower_wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .flower_stem {
            position: absolute;
            width: 10px;
            height: 150px;
            background-color: #8B4513; /* Color marrón para el tallo */
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .flower_center {
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: #5C4033; /* Color del centro de la flor */
            border-radius: 50%;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
        }

        .flower_petal {
            position: absolute;
            width: 80px;
            height: 30px;
            background-color: #FFD700; /* Color amarillo para los pétalos */
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* Posicionando los pétalos */
        .flower_petal-1 { transform: rotate(0deg); top: 0; left: 50%; transform: translate(-50%, 0); }
        .flower_petal-2 { transform: rotate(30deg); top: 0; left: 50%; transform: translate(-50%, 0); }
        .flower_petal-3 { transform: rotate(60deg); top: 0; left: 50%; transform: translate(-50%, 0); }
        .flower_petal-4 { transform: rotate(90deg); top: 0; left: 50%; transform: translate(-50%, 0); }
        .flower_petal-5 { transform: rotate(120deg); top: 0; left: 50%; transform: translate(-50%, 0); }
        .flower_petal-6 { transform: rotate(150deg); top: 0; left: 50%; transform: translate(-50%, 0); }
        .flower_petal-7 { transform: rotate(180deg); top: 0; left: 50%; transform: translate(-50%, 0); }
        .flower_petal-8 { transform: rotate(210deg); top: 0; left: 50%; transform: translate(-50%, 0); }
        .flower_petal-9 { transform: rotate(240deg); top: 0; left: 50%; transform: translate(-50%, 0); }
        .flower_petal-10 { transform: rotate(270deg); top: 0; left: 50%; transform: translate(-50%, 0); }
        .flower_petal-11 { transform: rotate(300deg); top: 0; left: 50%; transform: translate(-50%, 0); }
        .flower_petal-12 { transform: rotate(330deg); top: 0; left: 50%; transform: translate(-50%, 0); }

        .flower_leaf {
            position: absolute;
            width: 40px;
            height: 20px;
            background-color: #228B22; /* Color verde para las hojas */
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(34, 139, 34, 0.5);
        }

        .flower_leaf-1 {
            top: 100px;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        .flower_leaf-2 {
            top: 120px;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
        }
    </style>
</head>
<body>
    <div class="sunflower">
        <div class="flower_wrapper">
            <div class="flower_stem"></div>
            <div class="flower_center"></div>
            <div class="flower_petal flower_petal-1"></div>
            <div class="flower_petal flower_petal-2"></div>
            <div class="flower_petal flower_petal-3"></div>
            <div class="flower_petal flower_petal-4"></div>
            <div class="flower_petal flower_petal-5"></div>
            <div class="flower_petal flower_petal-6"></div>
            <div class="flower_petal flower_petal-7"></div>
            <div class="flower_petal flower_petal-8"></div>
            <div class="flower_petal flower_petal-9"></div>
            <div class="flower_petal flower_petal-10"></div>
            <div class="flower_petal flower_petal-11"></div>
            <div class="flower_petal flower_petal-12"></div>

            <div class="flower_leaf flower_leaf-1"></div>
            <div class="flower_leaf flower_leaf-2"></div>
        </div>
    </div>

    <div class="glow-text">Te amo Fran</div>
</body>
</html>
